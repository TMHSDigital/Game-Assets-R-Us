# Roblox: EXPERIMENTAL exporter. One FBX per piece variant, LOD0 only
# (Roblox builds its own LODs, see RenderFidelity), no collision meshes
# (set CollisionFidelity in Studio), one material per mesh with the piece's
# stone and mortar baked into one texture set on its unique UV layout.
# Verified by re-import in Blender only; Roblox Studio import is a TODO.
#
# Limits carry a value only when verified against the Roblox docs (source
# URL recorded); the exporter enforces verified limits and ignores the rest.
# Verified 2026-09-25 against the pages linked below.
name = "roblox"
kind = "mesh"
status = "experimental"
enabled_in_ci = true
experimental = true
# One cell keeps the game profiles' 2.0 m: 2.0 m / 0.28 m per stud.
# Source: https://create.roblox.com/docs/physics/units (1 stud = 28 cm).
cell_size = 7.142857
units = "studs"
format = "fbx"
lod_mode = "omit"
lod0_suffix = ""
collider_mode = "omit"
collider_pattern = "{name}_col{index:02d}"
material_mode = "single_baked"
piece_texture_size = 512

# Blender export settings from https://create.roblox.com/docs/art/modeling/export-requirements
# and https://create.roblox.com/docs/art/blender (units: Unit System None;
# FBX: Path Mode Copy, Embed Textures, Apply Scalings FBX Unit Scale, no
# leaf bones, no baked animation).
[export]
scene_unit_system = "NONE"
axis_forward = "-Z"
axis_up = "Y"
global_scale = 1.0
apply_unit_scale = true
apply_scale_options = "FBX_SCALE_UNITS"
bake_space_transform = false
mesh_smooth_type = "FACE"
path_mode = "COPY"
embed_textures = true

[limits.max_triangles_per_mesh]
value = 20000
source = "https://create.roblox.com/docs/art/modeling/specifications"
verified = true

[limits.max_texture_size_px]
value = 4096
source = "https://create.roblox.com/docs/art/modeling/texture-specifications"
verified = true

# "Mesh objects can only have one material assigned."
[limits.max_materials_per_mesh]
value = 1
source = "https://create.roblox.com/docs/art/modeling/texture-specifications"
verified = true

# Not stated on the specification pages checked; stays unverified.
[limits.max_mesh_bounds_studs]
source = "https://create.roblox.com/docs/art/modeling/specifications"
verified = false

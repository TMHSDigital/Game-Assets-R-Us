# Roblox: schema plus stub exporter only. Running this profile fails with a
# clear "stub" message; nothing is exported yet.
#
# No platform limit is applied unless it has been checked against the Roblox
# documentation: each entry under [limits] records the value, the source URL
# and verified = true, or stays without a value and verified = false.
# Verified 2026-09-25 against the pages linked below.
name = "roblox"
kind = "stub"
status = "stub"
enabled_in_ci = false
experimental = true
# One cell keeps the game profiles' 2.0 m: 2.0 m / 0.28 m per stud.
# Source: https://create.roblox.com/docs/physics/units (1 stud = 28 cm).
cell_size = 7.142857
units = "studs"
format = "fbx"

[limits.max_triangles_per_mesh]
value = 20000
source = "https://create.roblox.com/docs/art/modeling/specifications"
verified = true

[limits.max_texture_size_px]
value = 4096
source = "https://create.roblox.com/docs/art/modeling/texture-specifications"
verified = true

# "Mesh objects can only have one material assigned." Sampler pieces use two
# palette slots (stone, mortar), so a Roblox exporter must merge them.
[limits.max_materials_per_mesh]
value = 1
source = "https://create.roblox.com/docs/art/modeling/texture-specifications"
verified = true

# Not stated on the specification pages checked; stays unverified.
[limits.max_mesh_bounds_studs]
source = "https://create.roblox.com/docs/art/modeling/specifications"
verified = false

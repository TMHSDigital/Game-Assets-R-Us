# SPDX-License-Identifier: GPL-3.0-or-later
# FiveM via Sollumz: EXPERIMENTAL exporter, Blender 4.5 only, disabled in
# default CI; see .github/workflows/fivem-sollumz.yml (manual).
#
# Sollumz is never vendored. Install the pinned commit below (git archive,
# so the manifest version is filled in) into a Blender user folder plus the
# szio wheel Sollumz pins; point BLENDER_USER_RESOURCES at that folder and
# GARU_SZIO_SITE at the szio install directory (docs/TODO.md has the steps).
# Without Sollumz the profile exits 4 (UNAVAILABLE) with instructions.
#
# Output is CodeWalker XML (.ydr.xml) in gen8/ and gen9/, one drawable per
# piece variant with LOD0 to LOD2 as High/Medium/Low, embedded collision and
# normal.sps materials naming the baked textures (shipped as PNG in
# textures/ for building a .ytd). Binary .ydr needs PyMateria, which is
# proprietary and never used here. Verified by re-import through Sollumz;
# in-game testing is a TODO.
name = "fivem_sollumz"
kind = "mesh"
status = "experimental"
enabled_in_ci = false
experimental = true
cell_size = 2.0
units = "m"
format = "ydr_xml"
exporter = "sollumz"
lod_mode = "embedded"
lod0_suffix = ""
collider_mode = "embedded"
collider_pattern = "{name}_col{index:02d}"
blender_version = "4.5"
sollumz_repo = "https://github.com/Sollumz/Sollumz"
sollumz_commit = "f7fe61620bd32039e709bb137a3896b3b7c44e0b"
sollumz_addon = "bl_ext.user_default.sollumz_dev"
# Pinned by Sollumz itself (dependencies.py at the commit above).
szio_version = "1.4.0.dev0"
szio_sha256 = "acdd5b63960c713b055a955132d57a9c63e54f7ff1afcb4770a47ea13ef39ab8"
shader = "normal.sps"
collision_material = "STONE"
archetype_prefix = "garu_sdw_"
embedded_collision = true
# High, Medium, Low draw distances in meters.
lod_distances = [60.0, 120.0, 240.0]
streamed_memory_warn_mib = 16
# TODO: fill in the game build numbers to target once they are confirmed.
target_builds = []

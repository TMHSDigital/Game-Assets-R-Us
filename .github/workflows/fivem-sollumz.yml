# SPDX-License-Identifier: GPL-3.0-or-later
# EXPERIMENTAL, manual only, Blender 4.5 only. Installs Sollumz at the pinned
# commit (git archive at run time, never vendored) plus the szio wheel it
# pins, into an isolated Blender user folder, then runs the headless probe
# (profiles/fivem_sollumz/probe.py), the fivem_sollumz profile and its test.
name: fivem-sollumz (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Sollumz headless probe (Blender 4.5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Blender runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libxrender1 libxxf86vm1 libxfixes3 libxi6 \
            libxkbcommon0 libsm6 libice6

      - name: Download and verify Blender 4.5
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender4.5/"
          file=$(curl -fsSL "$base" | grep -oE "blender-4\.5\.[0-9]+-linux-x64\.tar\.xz" | sort -V | uniq | tail -1)
          version=$(echo "$file" | grep -oE "4\.5\.[0-9]+")
          curl -fSL --retry 3 -o "$RUNNER_TEMP/$file" "$base$file"
          curl -fSL --retry 3 -o "$RUNNER_TEMP/blender.sha256" "${base}blender-${version}.sha256"
          expected=$(grep " $file\$" "$RUNNER_TEMP/blender.sha256" | cut -d' ' -f1)
          [ "$expected" = "$(sha256sum "$RUNNER_TEMP/$file" | cut -d' ' -f1)" ] || { echo "::error::SHA-256 mismatch"; exit 1; }
          mkdir -p ~/blender
          tar -xf "$RUNNER_TEMP/$file" -C ~/blender --strip-components=1
          echo "GARU_BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"

      - name: Install pinned Sollumz and szio into an isolated user folder
        run: |
          set -euo pipefail
          p=profiles/fivem_sollumz/profile.toml
          val() { grep "^$1 " "$p" | cut -d'"' -f2; }
          echo "Sollumz $(val sollumz_repo) @ $(val sollumz_commit); szio $(val szio_version)"
          git clone --filter=blob:none "$(val sollumz_repo)" "$RUNNER_TEMP/sollumz"
          # git archive fills in the manifest version placeholder; a plain
          # checkout is rejected by Blender as an invalid version.
          git -C "$RUNNER_TEMP/sollumz" archive --format=tar "$(val sollumz_commit)" -o "$RUNNER_TEMP/sollumz.tar"
          user="$RUNNER_TEMP/blender-user"
          mkdir -p "$user/extensions/user_default/sollumz_dev"
          tar -xf "$RUNNER_TEMP/sollumz.tar" -C "$user/extensions/user_default/sollumz_dev"
          echo "szio==$(val szio_version) --hash=sha256:$(val szio_sha256)" > "$RUNNER_TEMP/szio.txt"
          py=$(find ~/blender -path "*python/bin/python3*" -type f | head -1)
          "$py" -m ensurepip --upgrade >/dev/null 2>&1 || true
          "$py" -m pip install --no-deps --require-hashes --only-binary=:all: \
            --target "$RUNNER_TEMP/szio_site" -r "$RUNNER_TEMP/szio.txt"
          echo "BLENDER_USER_RESOURCES=$user" >> "$GITHUB_ENV"

      - name: Headless probe (build, convert, export, re-import)
        run: |
          set -euo pipefail
          xvfb-run -a "$GARU_BLENDER" --background --factory-startup \
            --python profiles/fivem_sollumz/probe.py -- "$RUNNER_TEMP/probe_out" "$RUNNER_TEMP/szio_site"

      - name: Build, validate, export and verify the fivem_sollumz profile
        run: |
          set -euo pipefail
          echo "GARU_SZIO_SITE=$RUNNER_TEMP/szio_site" >> "$GITHUB_ENV"
          GARU_SZIO_SITE="$RUNNER_TEMP/szio_site" xvfb-run -a "$GARU_BLENDER" --background --factory-startup \
            --python core/cli.py -- run --kit stone-dungeon-wall-sampler --profile fivem_sollumz

      - name: FiveM determinism and Sollumz re-import test
        run: |
          set -euo pipefail
          GARU_BLENDER_45="$GARU_BLENDER" GARU_SOLLUMZ_USER="$BLENDER_USER_RESOURCES" \
            xvfb-run -a "$GARU_BLENDER" --background --factory-startup --python tests/run_tests.py -- --pattern test_fivem.py

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sollumz-probe
          path: |
            ${{ runner.temp }}/probe_out
            build/**/fivem_sollumz/export_manifest.json
            build/**/fivem_sollumz/streamed_memory.json
            dist/fivem_sollumz/
          if-no-files-found: ignore

# SPDX-License-Identifier: CC0-1.0
# Minimal contract for the external generator fixture.
schema_version = 1

[kit]
id = "demo-external"
name = "Demo External"
version = "0.0.1"
prefix = "DEMO"
generator = "demo-external"
default_seed = 7

[grid]
height_cells = 0.5
wall_thickness_cells = 0.25
snap_tolerance_cells = 0.0001

[style]
bevel_width_cells = 0.02
bevel_segments = 1
naming_pattern = "SM_{prefix}_{piece}_{variant}"
lod_pattern = "{name}_LOD{n}"
collider_pattern = "UCX_{name}_{index:02d}"
pivot_rule = "base_min_corner"
variants = ["clean"]

[materials]
max_slots_per_piece = 1

[[materials.palette]]
slot = "plinth"
kind = "procedural"
base_color = [0.5, 0.5, 0.5]
roughness = 0.8

[uv]
tiling_channel = "UVMap"
lightmap_channel = "Lightmap"
tiling_scale_per_cell = 0.5

[texel_density]
texture_size = 1024
min_px_per_cell = 256
max_px_per_cell = 1024
coverage = 0.9

[collider]
type = "convex"
max_faces_per_part = 255
max_parts = 1

[[pieces]]
id = "plinth"
footprint_cells = [1.0, 1.0]
height_cells = 0.5
lod_tris = [60, 26, 16]
print_base_cells = [1, 1]

[exports]
profiles = ["gltf_web", "stl_print"]

[legal]
license = "CC0-1.0"
license_file = "LICENSE-CC0"
texture_provenance = "generator"
brand_check = true
ai_content = false

[print]
manifold = true
min_wall_mm = 1.2
max_overhang_deg = 45
base_height_mm = 5.0
max_bbox_mm = [220.0, 220.0, 250.0]
print_orientation = "base_down"
presupport_required = false

[print.clip_system]
type = "none"
